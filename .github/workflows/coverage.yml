name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    secrets: inherit
    with:
      python_version: '3.11'
      coverage_source: 'ovos_commonqa'
      test_path: 'tests'
      pre_install_pip: '-r tests/requirements.txt git+https://github.com/OpenVoiceOS/ovos-spec-tools@feat/intent-primitives'
      install_extras: '.[test]'
      min_coverage: 0
